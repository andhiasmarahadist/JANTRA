        async function saveToFirebase(collectionName, payload) {
            if(!firebaseUser) throw new Error("Not authenticated to database");

        async function deleteFromFirebase(collectionName, id) {
            if(!firebaseUser) return;
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', collectionName, id);
            await deleteDoc(docRef);
        }

        async function batchSaveToFirebase(collectionName, payloadArray) {
            if(!firebaseUser) return;
            const batches = [];
            let batch = writeBatch(db);
            let count = 0;
            for(const item of payloadArray) {
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', collectionName, item.id);
                batch.set(docRef, item);
                count++;
                if (count === 490) {
                    batches.push(batch.commit());
                    batch = writeBatch(db);
                    count = 0;
                }
            }
            if (count > 0) batches.push(batch.commit());
            await Promise.all(batches);
        }

        async function deleteAllFromFirebase(collectionName) {
            if(!firebaseUser) return;
            const colRef = collection(db, 'artifacts', appId, 'public', 'data', collectionName);
            const snap = await getDocs(colRef);
            let batch = writeBatch(db);
            let count = 0;
            const batches = [];
            for (const document of snap.docs) {
                if (collectionName === 'users' && document.id === 'U-001') continue;
                batch.delete(document.ref);
                count++;
                if (count === 490) {
                     batches.push(batch.commit());
                     batch = writeBatch(db);
                     count = 0;
                }
            }
            if (count > 0) batches.push(batch.commit());
            await Promise.all(batches);
        }

            });

        async function compressImage(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader(); reader.readAsDataURL(file);
                reader.onload = event => {
                    const img = new Image(); img.src = event.target.result;
                    img.onload = () => {
                        let canvas = document.createElement('canvas'); let ctx = canvas.getContext('2d');
                        let maxW = 600, maxH = 600; let width = img.width, height = img.height;
                        if (width > height && width > maxW) { height *= maxW / width; width = maxW; }
                        else if (height > maxH) { width *= maxH / height; height = maxH; }
                        canvas.width = width; canvas.height = height; ctx.drawImage(img, 0, 0, width, height);
                        let quality = 0.9; let dataUrl = canvas.toDataURL('image/jpeg', quality);
                        const compress = () => {
                            let sizeKB = Math.round((dataUrl.length * 3 / 4) / 1024);
                            if (sizeKB > 25 && quality > 0.1) { quality -= 0.1; dataUrl = canvas.toDataURL('image/jpeg', quality); compress(); }
                            else resolve(dataUrl);
                        }; compress();
                    };
                };
            });
        }

        window.handleImageUpload = async function(event, previewId, base64Id) {

        window.initSignatureCanvas = function(canvasId) {
            const canvas = document.getElementById(canvasId);
            if (!canvas) return null;
            const ctx = canvas.getContext('2d');
            let drawing = false;

            const getPos = (e) => {
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return { x: clientX - rect.left, y: clientY - rect.top };
            };

            const startDrawing = (e) => { drawing = true; ctx.beginPath(); const pos = getPos(e); ctx.moveTo(pos.x, pos.y); e.preventDefault(); };
            const draw = (e) => { if (!drawing) return; const pos = getPos(e); ctx.lineTo(pos.x, pos.y); ctx.stroke(); e.preventDefault(); };
            const stopDrawing = () => { drawing = false; ctx.closePath(); };

            canvas.addEventListener('mousedown', startDrawing); canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stopDrawing); canvas.addEventListener('mouseout', stopDrawing);
            canvas.addEventListener('touchstart', startDrawing, { passive: false });
            canvas.addEventListener('touchmove', draw, { passive: false });
            canvas.addEventListener('touchend', stopDrawing);

            ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 3; ctx.lineCap = 'round';

            return {
                clear: () => ctx.clearRect(0, 0, canvas.width, canvas.height),
                getData: () => {
                    const blank = document.createElement('canvas');
                    blank.width = canvas.width; blank.height = canvas.height;
                    if (canvas.toDataURL() === blank.toDataURL()) return '';
                    return canvas.toDataURL();
                }
            };
        };

        window.handleLogin = async function(e) {
            e.preventDefault(); 
            const u = document.getElementById('loginUsername').value; 
            const p = document.getElementById('loginPassword').value;

            showLoading(); 
            try { 
                if(state.users.length === 0) {
                    const usersRef = collection(db, 'artifacts', appId, 'public', 'data', 'users');
                    const snap = await getDocs(usersRef);
                    state.users = snap.docs.map(d => d.data());
                }

                const user = state.users.find(x => x.nip === u || x.nip === `'${u}`);
                const cleanNip = user ? user.nip.replace(/^'/, '') : '';
                const cleanPass = user ? user.password.replace(/^'/, '') : '';

                closeLoading();

                if(user && cleanNip === u && cleanPass === p) { 
                    state.currentUser = user; 
                    state.currentUser.nip = cleanNip;
                    localStorage.setItem('jantra_user', JSON.stringify(state.currentUser));
                    showToast('success', `Selamat Datang, ${state.currentUser.nama}`); 
                    navigate('absensi'); 
                } else { 
                    Swal.fire('Gagal Login', 'Username / Password salah!', 'error');

            } catch(err) { 
                closeLoading();
                Swal.fire('Gagal Login', 'Terjadi kesalahan sistem/koneksi. ' + err.message, 'error');

        }

                else { sb.classList.add('md:flex'); sb.classList.remove('hidden'); }
            } else {
                if(sb.classList.contains('-translate-x-full')) { sb.classList.remove('hidden', '-translate-x-full'); ov.classList.remove('hidden'); } 
                else { sb.classList.add('-translate-x-full'); setTimeout(() => sb.classList.add('hidden'), 300); ov.classList.add('hidden'); } 
            }
        }

                </form>
            `;
            openModal(html);
        }

        window.simpanUser = async function(e, id) {
            e.preventDefault();
            const nip = document.getElementById('uNip').value;
            const nama = document.getElementById('uNama').value;
            const pass = document.getElementById('uPass').value;
            const role = document.getElementById('uRole').value;
            const mapel = document.getElementById('uMapel').value;
            
            const payload = {
                id: id || `U-${Date.now()}`,
                nip: nip,
                nama: nama,
                password: pass,
                role: role,
                mapel: mapel || '-',
                foto: '',
                ttd: ''
            };
            
            showLoading();
            try {
                await saveToFirebase('users', payload);
                closeLoading();
                closeModal();
                showToast('success', 'User berhasil disimpan');
            } catch(err) {
                closeLoading();
                Swal.fire('Error', 'Gagal menyimpan data.', 'error');
            }
        }

        window.hapusUser = function(id) {
            if(id === 'U-001') return Swal.fire('Ditolak', 'Admin utama tidak bisa dihapus', 'error');
            Swal.fire({title: 'Hapus User?', text: 'Data tidak bisa dikembalikan!', icon: 'warning', showCancelButton: true, confirmButtonText: 'Ya, Hapus'}).then(async (result) => {
                if(result.isConfirmed) {
                    showLoading();
                    await deleteFromFirebase('users', id);
                    closeLoading();
                    showToast('success', 'User dihapus');
                }
            });
        }

                    showLoading();
                    await deleteAllFromFirebase('users');
                    closeLoading();
                    showToast('success', 'Semua user dikosongkan');
                }
            });
        }

            let tbody = state.siswa.sort((a,b) => {
                if(a.kelas !== b.kelas) return a.kelas.localeCompare(b.kelas);
                return a.nama.localeCompare(b.nama);

                    <td class="p-4 text-sm font-bold text-gray-700">${s.nis} / ${s.nisn}</td>
                    <td class="p-4 text-sm font-bold text-gray-800">${s.nama}</td>

        window.filterSiswaRealtime = function() {
            const query = document.getElementById('fsNama').value.toLowerCase();
            const rows = document.querySelectorAll('.siswa-row');
            let hasVisible = false;
            rows.forEach(row => {
                const text = row.cells[2].textContent.toLowerCase() + " " + row.cells[4].textContent.toLowerCase();
                if(text.includes(query)) { row.style.display = ''; hasVisible = true; } 
                else row.style.display = 'none';
            });
        }

        window.loadFormAbsensi = function() {
            const kls = document.getElementById('absensiKelas').value;
            const area = document.getElementById('absensiFormArea');
            const tbody = document.getElementById('absensiSiswaBody');
            
            if(!kls) { area.classList.add('hidden'); return; }
            
            const siswaKelas = state.siswa.filter(s => s.kelas === kls).sort((a,b) => a.nama.localeCompare(b.nama));
            if(siswaKelas.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-6 text-center text-gray-400">Belum ada data siswa di kelas ${kls}</td></tr>`;
                area.classList.remove('hidden');
                return;
            }

            // Check if already filled today for this class by this teacher to load existing data
            const tgl = document.getElementById('absensiTanggal').value;
            const existing = state.absensi.find(a => a.kelas === kls && a.tanggal === tgl && a.guru_id === state.currentUser.id);

            tbody.innerHTML = siswaKelas.map((s, i) => {
                let status = 'H';
                if(existing) {
                    const rec = existing.data.find(x => x.siswa_id === s.id);
                    if(rec) status = rec.status;
                }
                const radio = (val, color) => `<input type="radio" name="abs_${s.id}" value="${val}" ${status === val ? 'checked' : ''} class="w-4 h-4 text-${color}-600 bg-gray-100 border-gray-300 focus:ring-${color}-500 focus:ring-2 cursor-pointer">`;
                
                return `
                <tr class="border-b border-gray-100 hover:bg-gray-50/50 siswa-abs-row" data-id="${s.id}" data-nama="${s.nama}">
                    <td class="p-3 text-center text-gray-500 text-sm">${i+1}</td>
                    <td class="p-3 text-sm font-bold text-gray-700">${s.nama}</td>
                    <td class="p-3 text-center">${radio('H', 'blue')}</td>
                    <td class="p-3 text-center">${radio('I', 'amber')}</td>
                    <td class="p-3 text-center">${radio('S', 'emerald')}</td>
                    <td class="p-3 text-center">${radio('A', 'red')}</td>

            }).join('');

        window.simpanAbsensi = async function() {
            const kls = document.getElementById('absensiKelas').value;
            const tgl = document.getElementById('absensiTanggal').value;
            if(!kls || !tgl) return Swal.fire('Error', 'Lengkapi kelas dan tanggal', 'error');

            // PREVENT DOUBLE ABSENSI HARI INI
            const existCheck = state.absensi.find(a => a.kelas === kls && a.tanggal === tgl && a.guru_id === state.currentUser.id);
            const isUpdate = !!existCheck;
            
            // Jika tidak sedang mengupdate (baru) tapi data sudah ada (double protection)
            if(!isUpdate && state.absensi.some(a => a.kelas === kls && a.tanggal === tgl && a.guru_id === state.currentUser.id)) {
                return Swal.fire('Peringatan', 'Anda sudah melakukan absensi di kelas ini pada hari ini! Silakan ubah data yang sudah ada.', 'warning');
            }

            const rows = document.querySelectorAll('.siswa-abs-row');
            let dataAbsen = [];
            rows.forEach(r => {
                const id = r.dataset.id;
                const status = document.querySelector(`input[name="abs_${id}"]:checked`).value;
                dataAbsen.push({ siswa_id: id, nama: r.dataset.nama, status: status });
            });

            const payload = {
                id: existCheck ? existCheck.id : `ABS-${Date.now()}`,
                guru_id: state.currentUser.id,
                nip_guru: state.currentUser.nip,
                nama_guru: state.currentUser.nama,
                kelas: kls,
                tanggal: tgl,
                data: dataAbsen,
                timestamp: new Date().toISOString()
            };

            showLoading();
            try {
                await saveToFirebase('absensi', payload);
                closeLoading();
                Swal.fire('Berhasil', 'Data absensi berhasil disimpan.', 'success');
            } catch(e) {
                closeLoading();
                Swal.fire('Error', 'Gagal menyimpan absensi.', 'error');
            }
        }

            <div class="max-w-3xl mx-auto">
                <h1 class="text-2xl font-bold text-gray-800 mb-6">Profil Saya</h1>
                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
                    <form onsubmit="updateProfil(event)" class="space-y-6">
                        <div class="flex flex-col items-center mb-6">
                            <img id="previewFoto" src="${getValidFoto(state.currentUser.foto, state.currentUser.nama)}" class="w-32 h-32 rounded-full object-cover border-4 border-blue-50 mb-3 shadow-md">
                            <input type="hidden" id="base64Foto" value="${state.currentUser.foto || ''}">
                            <label class="bg-blue-50 text-blue-600 px-4 py-2 rounded-full text-sm font-bold cursor-pointer hover:bg-blue-100 transition-colors">
                                <i class="fas fa-camera mr-2"></i>Ganti Foto
                                <input type="file" class="hidden" accept="image/*" onchange="handleImageUpload(event, 'previewFoto', 'base64Foto')">
                            </label>
                        </div>
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div><label class="block text-sm font-bold text-gray-700 mb-2">NIP / Username</label><input type="text" value="${state.currentUser.nip}" disabled class="w-full bg-gray-100 border border-gray-200 rounded-xl p-3 text-gray-500 cursor-not-allowed"></div>
                            <div><label class="block text-sm font-bold text-gray-700 mb-2">Nama Lengkap</label><input type="text" id="pNama" value="${state.currentUser.nama}" required class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 outline-none focus:ring-2 focus:ring-blue-500"></div>
                            <div><label class="block text-sm font-bold text-gray-700 mb-2">Password Baru (Kosongkan jika tidak diubah)</label><input type="password" id="pPass" placeholder="••••••••" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 outline-none focus:ring-2 focus:ring-blue-500"></div>
                            <div><label class="block text-sm font-bold text-gray-700 mb-2">Mata Pelajaran</label><input type="text" id="pMapel" value="${state.currentUser.mapel || '-'}" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 outline-none focus:ring-2 focus:ring-blue-500"></div>
                        </div>

                        <div class="mt-6 border-t pt-6">
                            <label class="block text-sm font-bold text-gray-700 mb-2">Tanda Tangan Elektronik</label>
                            <p class="text-xs text-gray-500 mb-3">Tanda tangan ini akan muncul secara otomatis di cetak laporan (Jurnal, Absensi, Nilai).</p>
                            <div class="flex flex-col items-start gap-3">
                                <canvas id="ttdCanvas" width="400" height="150" class="sig-canvas"></canvas>
                                <button type="button" onclick="if(ttdPad) ttdPad.clear()" class="text-sm bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-1.5 rounded-lg transition-colors font-medium">Bersihkan Tanda Tangan</button>
                            </div>
                        </div>

                        <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-xl shadow-md hover:bg-blue-700 active:scale-95 transition-all mt-6">Simpan Perubahan</button>
                    </form>
                </div>
            </div>`;
        }

        window.updateProfil = async function(e) {
            e.preventDefault();
            const nama = document.getElementById('pNama').value;
            const pass = document.getElementById('pPass').value;
            const mapel = document.getElementById('pMapel').value;
            const foto = document.getElementById('base64Foto').value;
            let ttdData = state.currentUser.ttd;
            if(ttdPad) {
                const newTtd = ttdPad.getData();
                if(newTtd.length > 100) ttdData = newTtd;
            }

            const updatedData = { ...state.currentUser, nama, mapel, foto, ttd: ttdData };
            if(pass) updatedData.password = pass;

            showLoading();
            try {
                await saveToFirebase('users', updatedData);
                state.currentUser = updatedData;
                localStorage.setItem('jantra_user', JSON.stringify(updatedData));
                closeLoading();
                Swal.fire('Berhasil', 'Profil telah diperbarui.', 'success');
                render(); // refresh UI
            } catch(err) {
                closeLoading();
                Swal.fire('Error', 'Gagal memperbarui profil.', 'error');
            }
        }

        // Initialize Call
        render();

    </script>
</body>
</html>
